<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tukar Kode Redeem - Digital Product Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <div class="container">
      <a href="index.html" class="logo">DigitalStore</a>
    </div>
  </nav>

  <section>
    <div class="container" style="max-width: 500px;">
      <div class="section-title">
        <h2>Tukarkan Kode Redeem</h2>
        <p>Masukkan kode 16 karakter unik yang Anda dapatkan untuk membuka produk digital.</p>
      </div>

      <div style="background: white; padding: 2rem; border-radius: 1rem; box-shadow: var(--shadow);">
        <form id="redeemForm">
          <div class="form-group">
            <label for="kodeRedeem">Kode Redeem Digital *</label>
            <input type="text" id="kodeRedeem" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX" required style="font-family: monospace; font-size: 1.125rem; text-transform: uppercase;">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Buka Akses Produk</button>
        </form>

        <div id="redeemResult" style="display: none; margin-top: 1.5rem; padding: 1rem; border-radius: 0.5rem;"></div>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('redeemForm').addEventListener('submit', handleRedeemSubmit);
  </script>
</body>
</html>

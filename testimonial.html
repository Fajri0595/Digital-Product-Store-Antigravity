<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berikan Testimoni - Digital Product Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <div class="container">
      <a href="index.html" class="logo">DigitalStore</a>
    </div>
  </nav>

  <section>
    <div class="container" style="max-width: 600px;">
      <div class="section-title">
        <h2>Berikan Testimoni</h2>
        <p>Bantu pembeli lain dengan berbagi pengalaman Anda.</p>
      </div>

      <div style="background: white; padding: 2rem; border-radius: 1rem; box-shadow: var(--shadow);">
        <form id="testimonialForm">
          <div class="form-group">
            <label for="idProduk">Produk yang dibeli *</label>
            <select id="idProduk" class="form-control" required>
              <option value="">Pilih...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="namaCustomer">Nama Saya *</label>
            <input type="text" id="namaCustomer" class="form-control" required placeholder="Nama">
          </div>

          <div class="form-group">
            <label for="emailCustomer">Email (opsional)</label>
            <input type="email" id="emailCustomer" class="form-control" placeholder="email@example.com">
          </div>

          <div class="form-group">
            <label>Rating *</label>
            <div id="ratingInput" style="font-size: 2rem; cursor: pointer;">
              <span class="star" data-rating="1">★</span>
              <span class="star" data-rating="2">★</span>
              <span class="star" data-rating="3">★</span>
              <span class="star" data-rating="4">★</span>
              <span class="star" data-rating="5">★</span>
            </div>
            <input type="hidden" id="rating" value="0" required>
          </div>

          <div class="form-group">
            <label for="isiTestimoni">Ulasan *</label>
            <textarea id="isiTestimoni" class="form-control" rows="5" placeholder="Ceritakan pengalaman Anda..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Kirim Testimoni</button>
        </form>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      loadProductsForTestimoni();
      setupRatingInput();
    });
  </script>
</body>
</html>
